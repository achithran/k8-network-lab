apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: k8s-network-lab:v1
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - app.database:app
            - --host
            - 0.0.0.0
            - --port
            - "8002"
          ports:
            - containerPort: 8002